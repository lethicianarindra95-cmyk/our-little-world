<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Little World 💜</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #f7edff, #e6d5ff);
    color: #68458c;
    text-align: center;
}

header {
    padding: 35px 15px;
}

h1 {
    color: #9864c9;
    font-size: 29px;
}

.subtitle {
    color: #9d7bb8;
}

.container {
    padding: 15px;
}

.card {
    background: white;
    border-radius: 22px;
    padding: 25px 15px;
    margin: 18px auto;
    max-width: 400px;
    box-shadow: 0 5px 15px #d9c4ed;
}

.icon {
    font-size: 38px;
}

button {
    background: #bd91e8;
    color: white;
    border: none;
    padding: 13px 25px;
    border-radius: 25px;
    font-size: 15px;
}

footer {
    padding: 25px;
    color: #a184bc;
}
</style>
</head>

<body>

<header>
    <div class="icon">🦋💜</div>
    <h1>Our Little World</h1>
    <p class="subtitle">Just you and me, forever ❤️</p>
</header>

<div class="container">

    <div class="card">
        <div class="icon">💌</div>
        <h2>Our Little Messages</h2>
        <p>Every day, a little more love.</p>
        <button>Nos messages</button>
    </div>

    <div class="card">
        <div class="icon">🎤</div>
        <h2>Our Voices</h2>
        <p>Even far away, I want to hear you.</p>
        <button>Messages vocaux</button>
    </div>

    <div class="card">
        <div class="icon">🎁</div>
        <h2>Surprise Box</h2>
        <p>Something special is waiting for you...</p>
        <button>Découvrir</button>
    </div>

    <div class="card">
        <div class="icon">📸</div>
        <h2>Our Memories</h2>
        <p>Our beautiful moments together.</p>
        <button>Nos souvenirs</button>
    </div>

</div>

<footer>
    Made with 💜 just for us
</footer>

</body>
</html>
